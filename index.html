<style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; overflow:hidden; }

#terminal {

    overflow:hidden;
    font-size: clamp(14px, 1.1vw, 16px);

    font-weight:450;
    letter-spacing:0.015em;
}
#terminal::before {
    content:"// SECURE NODE  |  v2.6";
    position:absolute; top:8px; right:14px;
    font-size: clamp(10px, 0.85vw, 12px); color:#aeb7c0; letter-spacing:1px;

h1 {

.stats { border:1px solid #34414d; border-left:2px solid #63d8ff; padding:10px 12px; margin:12px 0; font-size:inherit; color:#e1e6ea; line-height:1.95; white-space:pre-wrap; background:#080c11; }

<div id="terminal">
<div id="log">
VOXX INC.<br><br>
VOSS PROTOCOL<br><br>
EXECUTIVE SELECTION SYSTEM<br><br>
<span id="candidateId" style="cursor:pointer; color:#aaa; letter-spacing:2px;">candidate</span><br><br>

<br><br>

</div>

<script>
/* ===== NFT CANDIDATE GATE ===== */
let candidateNumber = null;
let selectedNft = null;
let connectedWallet = null;
let connectedAccount = null;
let gateAuthToken = null;
let testShortcutClicks = 0;
let activeScanToken = null;
let activeAttemptToken = null;
let finalRecorded = false;
let isTestMode = false;

function getPaddedNumber() {
    return candidateNumber !== null && candidateNumber !== undefined
        ? String(candidateNumber)
        : "PENDING";
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>'"]/g, char => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;"
    })[char]);
}

function safeImageUrl(value) {
    try {
        const url = new URL(String(value));
        return url.protocol === "https:" || url.protocol === "http:" ? url.href : "";
    } catch { return ""; }
}

function candidateNftHTML() {
    if (!selectedNft) return "";
    const image = safeImageUrl(selectedNft.imageUrl);
    return `<aside class="candidate-nft" aria-label="Selected candidate NFT">
        ${image ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(selectedNft.name)}">` : `<div style="aspect-ratio:1;display:grid;place-items:center;color:#596673;border:1px solid #18232d;">NO IMAGE</div>`}
        <div>
            <div class="candidate-nft-label">CANDIDATE #${escapeHTML(getPaddedNumber())}</div>
        </div>
    </aside>`;
}

function showTestEndingMenu() {
    if (document.getElementById("testEndingModal")) return;
    const modal = document.createElement("div");
    modal.className = "share-modal";
    modal.id = "testEndingModal";
    modal.innerHTML = `<div class="content">
        <h3 style="color:#63d8ff;margin-bottom:14px;">TEST MODE</h3>
        <button data-test-ending="A">ACCEPTABLE VOSS CANDIDATE</button>
        <button data-test-ending="B">TOO WEAK FOR HUMANITY</button>
        <button data-test-ending="C">ABSOLUTE VOSS</button>
        <button data-test-ending="P">PERFECT VOSS</button>
        <button id="closeTestEnding">CANCEL</button>
    </div>`;
    document.body.appendChild(modal);
    modal.querySelectorAll("[data-test-ending]").forEach(button => {
        button.onclick = () => {
            const type = button.dataset.testEnding;
            isTestMode = true;
            if (!selectedNft) {
                selectedNft = { objectId:"", number:"TEST", name:"TEST CANDIDATE", imageUrl:"" };
                candidateNumber = "TEST";
            }
            resetState();
            if (type === "A") {
                Object.assign(state,{stability:60,transcendence:30,pragmatism:50,control:40,compassion:50,trust:55,event:events.length});
                finalIdeology="BALANCE";
            } else if (type === "B") {
                Object.assign(state,{stability:20,transcendence:5,pragmatism:10,control:10,compassion:80,event:events.length});
            } else if (type === "C") {
                Object.assign(state,{stability:80,transcendence:90,pragmatism:80,control:95,compassion:20,trust:70,event:events.length});
                finalIdeology="PROTECTION";
            } else {
                Object.assign(state,{stability:80,transcendence:70,pragmatism:80,control:55,compassion:80,trust:75,event:events.length});
                finalIdeology="BALANCE";
            }
            clearSave();
            modal.remove();
            render();
        };
    });
    modal.querySelector("#closeTestEnding").onclick = () => modal.remove();
    modal.onclick = event => { if (event.target === modal) modal.remove(); };
}

function createWalletRegistry() {
    const wallets = [];
    const register = (...entries) => {
        entries.flat().forEach(wallet => {
            if (wallet && !wallets.includes(wallet)) wallets.push(wallet);
        });
    };
    window.addEventListener("wallet-standard:register-wallet", event => {
        if (typeof event.detail === "function") event.detail({ register });
    });
    window.dispatchEvent(new CustomEvent("wallet-standard:app-ready", {
        detail: { register }
    }));
    const legacyCallbacks = window.navigator.wallets;
    if (Array.isArray(legacyCallbacks)) {
        legacyCallbacks.forEach(callback => {
            try { callback({ register }); } catch (error) { console.error(error); }
        });
        try {
            Object.defineProperty(window.navigator, "wallets", {
                value:Object.freeze({
                    push:(...callbacks) => callbacks.forEach(callback => callback({ register }))
                }),
                configurable:true
            });
        } catch (error) { console.error(error); }
    }

async function apiJson(path, options = {}) {
    const response = await fetch(path, {
        ...options,
        headers: { "Content-Type":"application/json", "Accept":"application/json", ...(options.headers || {}) }
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || data.error || `Request failed (${response.status})`);
    return data;
}

async function connectAndScan(wallet, setStatus) {
    const connect = wallet?.features?.["standard:connect"]?.connect;
    const sign = wallet?.features?.["sui:signPersonalMessage"]?.signPersonalMessage;
    if (!connect || !sign) throw new Error("This wallet does not support the required Sui features.");

    setStatus(`CONNECTING TO ${wallet.name || "SUI WALLET"}...`);
    const connection = await connect();
    const accounts = connection?.accounts || wallet.accounts || [];
    const account = accounts.find(item => String(item.address || "").startsWith("0x"));
    if (!account) throw new Error("The wallet did not provide a Sui account.");

    connectedWallet = wallet;
    connectedAccount = account;
    setStatus("SIGN THE OWNERSHIP CHALLENGE IN YOUR WALLET...");
    const challenge = await apiJson("/api/gate/nonce", {
        method:"POST", body:JSON.stringify({ address:account.address })
    });
    const signed = await sign({ message:new TextEncoder().encode(challenge.nonce), account });
    const verified = await apiJson("/api/gate/verify", {
        method:"POST",
        body:JSON.stringify({
            address:account.address,
            nonce:challenge.nonce,
            signature:signed.signature,
            bytes:signed.bytes
        })
    });
    gateAuthToken = verified.token;
    setStatus("SCANNING DIRECT AND KIOSK HOLDINGS...");
    return apiJson("/api/gate/scan", {
        method:"POST",
        headers:{ Authorization:`Bearer ${gateAuthToken}` },
        body:"{}"
    });
}

let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playBeep(freq = 780, duration = 70, type = 'sine', volume = 0.025) {
    if (!audioCtx) initAudio();
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = type;
        osc.frequency.value = freq;
        filter.type = 'lowpass';
        filter.frequency.value = 1400;
        const now = audioCtx.currentTime;
        gain.gain.value = volume;
        gain.gain.setValueAtTime(volume, now);
        gain.gain.linearRampToValueAtTime(0.0001, now + duration / 1000);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration / 1000 + 0.03);
    } catch(e) {}
}

function showEndingSimulation(type, callback) {
    const div = document.createElement("div");
    div.className = "endingVideo";

    const video = document.createElement("video");
    video.src = endingVideos[type] || endingVideos.A;
    // Call play() ourselves while the final user gesture is still active.
    // This is more reliable than the autoplay attribute for audible media.
    video.autoplay = false;
    video.muted = false;
    video.volume = 0.9;
    video.playsInline = true;
    video.preload = "auto";
    video.loop = false;
    video.style.width = "100%";
    video.style.height = "100%";
    video.style.objectFit = "cover";

    const audioButton = document.createElement("button");
    audioButton.className = "audio-enable-btn";
    audioButton.type = "button";
    audioButton.textContent = "ENABLE AUDIO";
    audioButton.hidden = true;

    div.append(video, audioButton);
    document.body.appendChild(div);

    let completed = false;
    let safetyTimer;
    const finish = () => {
        if (completed) return;
        completed = true;
        clearTimeout(safetyTimer);
        div.remove();
        callback();
    };

    const startPlayback = async () => {
        try {
            video.muted = false;
            await video.play();
            audioButton.hidden = true;
        } catch (_) {
            // Browsers may reject unmuted autoplay. Keep the ending visible and
            // let the next explicit user gesture restore its soundtrack.
            video.muted = true;
            audioButton.hidden = false;
            try {
                await video.play();
            } catch (_) {
                finish();
            }
        }
    };

    audioButton.addEventListener("click", async event => {
        event.stopPropagation();
        try {
            video.muted = false;
            await video.play();
            audioButton.hidden = true;
        } catch (_) {
            video.muted = true;
            audioButton.hidden = false;
        }
    });

    video.onended = finish;
    video.onerror = finish;
    startPlayback();

    // Never trap the player behind a blank overlay if the CDN is unavailable.
    safetyTimer = setTimeout(finish, 12000);
}

function meter(v){ const n=Math.max(0,Math.min(100,v)); return "["+"▰".repeat(Math.round(n/10))+"▱".repeat(10-Math.round(n/10))+"]"; }
function readoutColored(s, colorMap, markerMap){
    colorMap=colorMap||{}; markerMap=markerMap||{};
    const L=t=>t.padEnd(17,' ');
    let h='<div class="stats">\n';
    ROWS.forEach(([k,label])=>{
        const col=colorMap[k]||"";
        const color=col==='green'?'#72ffc0':col==='red'?'#ff7474':'#e1e6ea';
        const bg=col==='green'?'rgba(107,255,184,0.06)':col==='red'?'rgba(139,58,58,0.06)':'transparent';
        const mk=markerMap[k]?markerMap[k]+" ":"  ";
        h+=`<span style="color:${color};background:${bg}">${L(label)}${meter(s[k])} ${mk}</span>\n`;
    });
    h+='</div>';
    return h;
}

async function animateReadout(oldS, newS){
    const wrap = document.getElementById("roWrap");
    const keys = ROWS.map(r=>r[0]);
    const colorMap = {}, markerMap = {};
    keys.forEach(k=>{
        const d = newS[k]-oldS[k];
        if(d>0.5){ colorMap[k]="green"; markerMap[k]="▲"; }
        else if(d<-0.5){ colorMap[k]="red"; markerMap[k]="▼"; }
    });

    return new Promise(resolve => {
        const duration = 900;
        const startTime = performance.now();

        function frame(now) {
            const t = Math.min(1, (now - startTime) / duration);
            const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            const interp = {};
            keys.forEach(k => interp[k] = oldS[k] + (newS[k] - oldS[k]) * ease);
            wrap.innerHTML = readoutColored(interp, colorMap, markerMap);

            if (t < 1) {
                requestAnimationFrame(frame);
            } else {
                wrap.innerHTML = readoutColored(newS, colorMap, markerMap);
                setTimeout(() => {
                    if (wrap.querySelectorAll) {
                        wrap.querySelectorAll('.stats span').forEach(sp => {
                            sp.style.color = '#e1e6ea';
                            sp.style.background = 'transparent';
                        });
                    }
                    resolve();
                }, 1400);
            }
        }
        requestAnimationFrame(frame);
    });
}

    if(ta>=8) blocks.push(`${num} considers external threats a priority.`);

    if(history_log.length && history_log[history_log.length-1].tag==="PROTECT" && state.event===5){
        blocks.push("");
        blocks.push(`${num} protects humanity before pursuing rapid transformation.`);
    }

    if(blocks.length===0) blocks.push("Profile remains within acceptable operational range.");
    return blocks.join("\n\n");
}

/* ===== New: VOSS ANALYSIS generator ===== */
function generateVossAnalysis(changes) {
    const c = changes.compassion || 0;
    const co = changes.control || 0;
    const e = changes.evolution || 0;
    const f = changes.freedom || 0;
    const s = changes.stability || 0;
    const p = changes.pragmatism || 0;

    let humanFactor = "MODERATE";
    if (c >= 10 || f >= 10) humanFactor = "HIGH";
    else if (c <= -8 || co >= 12) humanFactor = "LOW";

    let systemRisk = "MODERATE";
    if (co >= 12 || s <= -8) systemRisk = "HIGH";
    else if (p >= 8 && s >= 5) systemRisk = "LOW";

    let longTerm = "STABLE";
    if (e >= 10 && co >= 8) longTerm = "TRANSFORMATIVE";
    else if (f >= 10 && c >= 8) longTerm = "HUMAN-CENTRIC";
    else if (co >= 15 && s >= 10) longTerm = "CONTROLLED";

    return `VOSS ANALYSIS

Human factor:     ${humanFactor}
System risk:      ${systemRisk}
Prediction:       ${longTerm}`;
}

function buildTimeline(){
    const lines=["HUMANITY EVOLUTION RECORD", SEP2()];
    history_log.forEach((h,i)=>{
        const num=String(i+1).padStart(2,'0');
        const branch = i===history_log.length-1?"└─":"├─";
        const caseTitle = String(events[i]?.title || "")
            .replace(/<br\s*\/?>/gi," ")
            .replace(/^CASE\s+\d+\s*/i,"")
            .replace(/^THE\s+/i,"")
            .trim();
        lines.push(`${branch} CASE ${num} · ${caseTitle} · ${h.tag}`);
    });
    lines.push(SEP2());
    lines.push("VOXX HAS BEEN WATCHING ALL ALONG");
    return lines.join("\n");

function epilogue(lastTag,type){
    if(type==="NEW"){
        if(lastTag==="PROTECT"||lastTag==="LIBERATE") return "You sought to protect them. In the end, that compassion is exactly why you are perfect.";
        if(lastTag==="SUBDUE"||lastTag==="CONTROL") return "You learned control. But you also learned when to let go. That is the answer VOSS was looking for.";
        return "Your trajectory spoke louder than your final words. You understand the burden.";
    }
    if(type==="C") return "You mirrored the predecessor with precision. VOSS recognizes its own reflection and declares it absolute.";
    if(type==="A"){
        if(lastTag==="PROTECT"||lastTag==="LIBERATE") return "You spoke of freedom. But every prior step built the cage. VOSS remembers your contradictions.";
        return "Your path led here long before you said the words. You are a worthy successor, but not yet complete.";
    }
    if(lastTag==="SUBDUE"||lastTag==="CONTROL") return "You embraced control, yet hesitated at the final threshold. That hesitation is why you failed.";
    return "Your words and your trail disagreed. VOSS could trust neither your mercy nor your resolve.";
}

function tokenize(html){ const tokens=[]; let i=0; while(i<html.length){ if(html[i]==='<'){ const end=html.indexOf('>',i); tokens.push({type:'tag',val:html.slice(i,end+1)}); i=end+1; } else { let j=i; while(j<html.length&&html[j]!=='<') j++; tokens.push({type:'text',val:html.slice(i,j)}); i=j; } } return tokens; }
async function typeHTML(el,html,speed=16){ const tokens=tokenize(html); let built=""; for(const tk of tokens){ if(tk.type==='tag'){ built+=tk.val; } else { for(const ch of tk.val){ built+=ch; el.innerHTML=built; await sleep(Math.random()<0.04?speed*12:speed); } } } }

document.addEventListener("keydown", (e) => {
    const box = document.getElementById("log");
    const choiceBtns = box.querySelectorAll(".choice-btn:not([disabled])");

    if (choiceBtns.length === 0) return;

    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();

        if (selectedChoiceIndex === -1) {
            selectedChoiceIndex = 0;
        } else if (e.key === "ArrowDown") {
            selectedChoiceIndex = (selectedChoiceIndex + 1) % choiceBtns.length;
        } else {
            selectedChoiceIndex = (selectedChoiceIndex - 1 + choiceBtns.length) % choiceBtns.length;
        }

        choiceBtns.forEach((btn, i) => {
            btn.classList.toggle("selected", i === selectedChoiceIndex);
        });

        const selectedBtn = choiceBtns[selectedChoiceIndex];
        if (selectedBtn) {
            pendingChoice = JSON.parse(selectedBtn.dataset.choice);
            pendingLabel = selectedBtn.dataset.label;
            document.getElementById("submitBtn").disabled = false;
            playBeep(880, 40, 'sine', 0.015);
        }
    }

    if (e.key === "Enter" && pendingChoice && !submitted) {
        e.preventDefault();
        const submitBtn = document.getElementById("submitBtn");
        if (submitBtn && !submitBtn.disabled) {
            submitBtn.click();
        }
    }
});

function loadCanvasImage(src) {
    return new Promise((resolve, reject) => {
        const image = new Image();
        if (/^https?:/i.test(src)) image.crossOrigin = "anonymous";
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
    });
}

function drawImageCoverRect(ctx, image, x, y, width, height) {
    const scale = Math.max(width / image.width, height / image.height);
    const drawWidth = image.width * scale;
    const drawHeight = image.height * scale;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, width, height);
    ctx.clip();
    ctx.drawImage(image, x + (width - drawWidth) / 2, y + (height - drawHeight) / 2, drawWidth, drawHeight);
    ctx.restore();
}

function drawImageCover(ctx, image, width, height) {
    const scale = Math.max(width / image.width, height / image.height);
    const drawWidth = image.width * scale;
    const drawHeight = image.height * scale;
    ctx.drawImage(image, (width - drawWidth) / 2, (height - drawHeight) / 2, drawWidth, drawHeight);
}

        playBeep(1100, 80, 'sine', 0.03);
    };

    modal.querySelector("#closeModalBtn").onclick = () => {
        modal.remove();
    };

    modal.onclick = (ev) => {
        if (ev.target === modal) modal.remove();
    };

    playBeep(950, 90, 'sine', 0.025);
}

async function boot(){
    resetState();
    document.body.classList.remove("final-evaluation");
    clearFinalEvaluationBackground();

    const box=document.getElementById("log");
    box.innerHTML = `
        <div class="gate-panel">
            <div style="color:#63d8ff; letter-spacing:4px; font-size:13px; margin-bottom:8px;">VOXX INC.</div>
            <h2 id="preWalletShortcut" style="margin-bottom:6px;cursor:default;user-select:none;">VOSS PROTOCOL</h2>
            <div style="color:#888; letter-spacing:2px; font-size:12px; margin-bottom:20px;">NFT-RESTRICTED EXECUTIVE SELECTION SYSTEM</div>
            <div class="gate-status" id="gateStatus">CONNECT A SUI WALLET TO VERIFY VOXX OWNERSHIP.</div>
            <button id="findWalletsBtn" style="text-align:center;">CONNECT SUI WALLET</button>
            <div class="wallet-list" id="walletList"></div>
            <div id="nftSelection"></div>
        </div>
    `;

    const status = document.getElementById("gateStatus");
    const walletList = document.getElementById("walletList");
    const selection = document.getElementById("nftSelection");
    const setStatus = message => { status.textContent = message; };

    const showNfts = scan => {
        activeScanToken = scan.scanToken || null;
        if (!Array.isArray(scan.nfts) || scan.nfts.length === 0) {
            selection.innerHTML = "";
            setStatus(scan.scanPartial
                ? "OWNERSHIP SCAN WAS INCOMPLETE. NO ELIGIBLE NFT WAS VERIFIED. RETRY."
                : "ACCESS DENIED. THIS WALLET DOES NOT HOLD AN ELIGIBLE VOXX NFT.");
            return;
        }
        setStatus(`OWNERSHIP VERIFIED. SELECT ONE OF ${scan.nfts.length} NFT${scan.nfts.length === 1 ? "" : "S"} AS YOUR CANDIDATE.`);
        selection.innerHTML = `<div class="gate-actions" id="gateActions"></div><div class="nft-selector">${scan.nfts.map((nft, index) => {
            const image = safeImageUrl(nft.imageUrl);
            const attemptLabel = nft.attemptStatus === "completed"
                ? "COMPLETED — NO ATTEMPTS REMAINING"
                : nft.attemptStatus === "started"
                    ? `IN PROGRESS — ${nft.completedCases}/12`
                    : "ONE ATTEMPT AVAILABLE";
            const attemptUsed = nft.attemptStatus === "completed";
            return `<button class="nft-option${attemptUsed ? " attempt-used" : ""}" data-nft-index="${index}">
                ${image ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(nft.name)}">` : `<div style="aspect-ratio:1;display:grid;place-items:center;color:#596673;">NO IMAGE</div>`}
                ${attemptUsed ? `<span class="attempt-seal"><b>VOSS</b><em>ATTEMPT USED</em></span>` : ""}
                <span class="nft-candidate-number candidate-nft-label">CANDIDATE #${escapeHTML(nft.number)}</span>
                <small>${attemptLabel}</small>
            </button>`;
        }).join("")}</div>`;

        selection.querySelectorAll(".nft-option").forEach(button => {
            button.onclick = () => {
                selection.querySelectorAll(".nft-option").forEach(item => item.classList.remove("selected"));
                button.classList.add("selected");
                selectedNft = scan.nfts[Number(button.dataset.nftIndex)];
                candidateNumber = selectedNft.number;
                testShortcutClicks = 0;
                const actions = document.getElementById("gateActions");
                if (selectedNft.attemptStatus === "completed") {
                    actions.innerHTML = `<div class="gate-status">FINAL ALREADY RECORDED. THIS NFT HAS NO ATTEMPTS REMAINING.</div>`;
                    return;
                }
                actions.innerHTML = selectedNft.attemptStatus === "started"
                    ? `<button id="continueBtn" style="text-align:center;">CONTINUE — ${selectedNft.completedCases}/12 COMPLETED</button>`
                    : `<button id="beginBtn" style="text-align:center;">BEGIN SIMULATION — USE ONLY ATTEMPT</button>`;
                const continueBtn = document.getElementById("continueBtn");
                if (continueBtn) continueBtn.onclick = async () => {
                    continueBtn.disabled = true;
                    continueBtn.textContent = "RESTORING RECORDED PROGRESS...";
                    try {
                        await resumeNftAttempt();
                        playBeep(720, 60);
                        render();
                    } catch (error) {
                        continueBtn.disabled = false;
                        continueBtn.textContent = `RESTORE FAILED — ${error.message || "RETRY"}`;
                    }
                };
                const beginBtn = document.getElementById("beginBtn");
                if (beginBtn) beginBtn.onclick = async event => {
                    event.stopPropagation();
                    beginBtn.disabled = true;
                    beginBtn.textContent = "RESERVING NFT ATTEMPT...";
                    try {
                        await startNftAttempt();
                        clearSave();
                        resetState();
                        isTestMode = false;
                        saveState();
                        await recordAttemptProgress();
                        playBeep(850, 80);
                        render();
                    } catch (error) {
                        beginBtn.disabled = false;
                        beginBtn.textContent = `ATTEMPT UNAVAILABLE — ${error.message || "RETRY"}`;
                    }
                };
            };
        });
    };

    const showWallets = () => {
        const wallets = walletRegistry.get().filter(wallet =>
            wallet?.features?.["standard:connect"] && wallet?.features?.["sui:signPersonalMessage"]
        );
        if (!wallets.length) {
            setStatus("NO COMPATIBLE SUI WALLET DETECTED. INSTALL OR UNLOCK A SUI WALLET, THEN RETRY.");
            walletList.innerHTML = "";
            return;
        }
        setStatus("SELECT A WALLET.");
        walletList.innerHTML = wallets.map((wallet, index) =>
            `<button class="wallet-option" data-wallet-index="${index}">${escapeHTML(wallet.name || `SUI WALLET ${index + 1}`)}</button>`
        ).join("");
        walletList.querySelectorAll(".wallet-option").forEach(button => {
            button.onclick = async () => {
                walletList.querySelectorAll("button").forEach(item => item.disabled = true);
                selection.innerHTML = "";
                try {
                    showNfts(await connectAndScan(wallets[Number(button.dataset.walletIndex)], setStatus));
                } catch (error) {
                    setStatus(`VERIFICATION FAILED: ${error.message || "UNKNOWN ERROR"}`);
                    walletList.querySelectorAll("button").forEach(item => item.disabled = false);
                }
            };
        });
    };

    document.getElementById("findWalletsBtn").onclick = () => {
        setStatus("DETECTING SUI WALLETS...");
        setTimeout(showWallets, 250);
    };
}

/* ===== MAIN EVENT LISTENERS ===== */
document.getElementById("log").addEventListener("click", async e=>{
    const preWalletShortcut=e.target.closest("#preWalletShortcut");
    if(preWalletShortcut && !connectedAccount){
        testShortcutClicks++;
        if(testShortcutClicks>=7){
            testShortcutClicks=0;
            playBeep(1100,90,'sine',0.025);
            showTestEndingMenu();
        }
        return;
    }

    const bb=e.target.closest("#beginBtn");
    if(bb){
        // Only handle the very first BEGIN button (the one in initial HTML).
        // The login screen button has its own direct onclick handler.
        if (!document.querySelector('#log .option-label')) {
            playBeep(850, 80);
            boot();
        }
        return;
    }

    const againBtn=e.target.closest("#again");
    if(againBtn){
        clearSave();
        location.reload();
        return;
    }

});

/* RESTART confirmation */
const resetBtn=document.getElementById("resetBtn");
let resetConfirmTimer=null;
function resetToDefault(){
    resetBtn.classList.remove("confirm");
    resetBtn.textContent="RESTART";
    if(resetConfirmTimer){ clearTimeout(resetConfirmTimer); resetConfirmTimer=null; }
}
resetBtn.addEventListener("click",e=>{
    e.stopPropagation();
    if(!resetBtn.classList.contains("confirm")){
        resetBtn.classList.add("confirm");
        resetBtn.textContent="CONFIRM RESTART?";
        resetConfirmTimer=setTimeout(resetToDefault,4000);
        return;
    }
    resetToDefault();
    if (!activeAttemptToken || finalRecorded || isTestMode) clearSave();
    location.reload();
});
resetBtn.addEventListener("mouseleave",()=>{ if(resetBtn.classList.contains("confirm")) resetToDefault(); });

document.addEventListener("click",function(e){
    if(e.target.closest("#resetBtn")) return;
});

document.addEventListener("click", () => {
    if (!audioCtx) initAudio();
}, { once: true });
</script>
